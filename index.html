<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>AN STRATO</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231f3a5f'/><text x='32' y='42' font-family='Georgia,serif' font-size='28' fill='%23f4efe6' text-anchor='middle'>AN</text></svg>">
<style>
:root{--bg:#f4efe6;--ink:#1d1d1b;--mut:#6b675f;--acc:#1f3a5f;--card:#fffdf8;--rule:#d9d2c3}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--ink:#ece7dc;--mut:#a39e93;--acc:#8fb3dd;--card:#1f1f1c;--rule:#3a3832}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding:16px}
main{width:100%;max-width:360px;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:28px}
h1{font:600 22px Georgia,serif;margin:0 0 4px}p{margin:0 0 18px;color:var(--mut);font-size:13px}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
input{width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:transparent;color:var(--ink);font:inherit}
button{margin-top:18px;width:100%;padding:11px;border:0;border-radius:8px;background:var(--acc);color:var(--card);font:600 14px system-ui;cursor:pointer}
button:disabled{opacity:.6}#msg{min-height:20px;margin-top:12px;font-size:13px;color:#b0413e}
</style></head><body>
<main id="box"><h1>AN STRATO</h1><p>Cuadro de mando. Entra con tu cuenta de Cerebro.</p>
<form id="f" hidden><label for="e">Correo</label><input id="e" type="email" autocomplete="username" required>
<label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password" required>
<button id="b" type="submit">Entrar</button></form><div id="msg">Comprobando la sesión…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  const sb = window.supabase.createClient('https://fypdaohzzvhmrumetqhf.supabase.co', 'sb_publishable_rQzjV9-cZoXcScfaBkeNJQ_H3v5Hw8H', { auth: { persistSession: true, storageKey: 'anstrato.auth' } });
  const f = document.getElementById('f'), msg = document.getElementById('msg'), b = document.getElementById('b');
  async function abrir(){
    msg.style.color = ''; msg.textContent = 'Cargando el panel…';
    const { data, error } = await sb.from('anstrato_docs').select('datos').eq('coleccion', '_web').eq('id', 'panel').maybeSingle();
    if (error || !data) { msg.style.color = '#b0413e'; msg.textContent = 'Tu usuario no tiene acceso al panel.'; f.hidden = false; await sb.auth.signOut(); return; }
    const bin = Uint8Array.from(atob(data.datos.gz), c => c.charCodeAt(0));
    const html = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
  }
  f.addEventListener('submit', async ev => {
    ev.preventDefault(); b.disabled = true; msg.textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('e').value.trim(), password: document.getElementById('p').value });
    document.getElementById('p').value = ''; b.disabled = false;
    if (error) { msg.textContent = 'No se ha podido entrar: revisa correo y contraseña.'; return; }
    abrir();
  });
  sb.auth.getSession().then(({ data }) => { if (data.session) abrir(); else { msg.textContent = ''; f.hidden = false; document.getElementById('e').focus(); } });
})();
</script>
</body></html>
